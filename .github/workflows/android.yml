name: Собрать APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка
        run: gradle -p android assembleRelease --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk koshelek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koshelek-apk
          path: koshelek.apk

      - name: Выложить на страницу Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Кошелёк — Android
          body: Скачайте koshelek.apk на телефон и установите.
          files: koshelek.apk
          make_latest: true
