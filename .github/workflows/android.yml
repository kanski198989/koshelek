name: Собрать APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Сборка
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Показать ошибку
        if: failure()
        run: |
          grep -nE "error:|What went wrong|Duplicate class|Could not|not found|\.java:[0-9]+" build.log | grep -v "^\s*at " | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -15 build.log | while IFS= read -r l; do echo "::warning::${l:0:900}"; done

      - name: Переименовать
        run: cp android/app/build/outputs/apk/release/app-release.apk koshelek.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koshelek-apk
          path: koshelek.apk

      - name: Выложить на страницу Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Кошелёк — Android
          body: Скачайте koshelek.apk на телефон и установите.
          files: koshelek.apk
          make_latest: true
